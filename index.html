    <script>
      // Gracefully prevent unhandled WebSocket closure error alerts from Vite dev client in iframe/reverse proxy
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          typeof e.reason.message === 'string' &&
          (e.reason.message.includes('WebSocket closed without opened') ||
           e.reason.message.includes('failed to connect to websocket'))
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket closed without opened') ||
           e.message.includes('failed to connect to websocket'))
        ) {
          e.preventDefault();
        }
      });
    </script>
